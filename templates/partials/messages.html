{% if messages %}
  <div class="mb-3">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} d-flex align-items-start gap-2 py-3 px-3" data-autohide role="alert">
        <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-x-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
